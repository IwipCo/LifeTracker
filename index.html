<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Tracker — Aujourd'hui</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="brand">
      <h1 style="font-size:20px;">📓 Life Tracker</h1>
      <span class="mark">carnet perso</span>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="active">Aujourd'hui</a>
      <a href="dashboard.html">Statistiques</a>
      <a href="import.html">Import / Export</a>
      <a href="settings.html">Réglages</a>
    </nav>
    <button class="icon-btn" id="theme-toggle">🌙 Sombre</button>
  </div>

  <!-- Saisie du jour -->
  <div class="panel">
    <div class="panel-header">
      <div>
        <div class="period-nav" style="justify-content:flex-start; margin-bottom:0;">
          <button class="icon-btn btn-sm" id="btn-prev-day">←</button>
          <span id="day-label" class="period-label" style="min-width:auto; font-size:17px;"></span>
          <button class="icon-btn btn-sm" id="btn-next-day">→</button>
          <button class="icon-btn btn-sm" id="btn-today">Aujourd'hui</button>
        </div>
        <p class="subtitle">Saisie du jour — coche, note, en moins d'une minute.</p>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span id="fill-badge" class="pill" style="background:var(--accent);"></span>
        <button class="btn btn-sm" id="btn-duplicate" title="Copier les valeurs d'hier">⧉ Dupliquer hier</button>
      </div>
    </div>
    <div id="day-form" class="day-entry-list"></div>
  </div>

  <!-- Vue tableau (ledger) -->
  <div class="panel">
    <div class="panel-header">
      <div class="period-nav" style="justify-content:flex-start; margin-bottom:0;">
        <button class="icon-btn btn-sm" id="btn-prev-period">←</button>
        <span id="period-label" class="period-label" style="min-width:auto; font-size:16px;"></span>
        <button class="icon-btn btn-sm" id="btn-next-period">→</button>
      </div>
      <div class="view-toggle">
        <button data-view="week" class="active">Semaine</button>
        <button data-view="month">Mois</button>
      </div>
    </div>
    <div id="ledger-wrap" class="ledger-wrap"></div>
  </div>

  <footer class="app-footer">Données stockées localement dans ton navigateur — pense à exporter régulièrement depuis « Import / Export ».</footer>
</div>

<script src="js/common.js"></script>
<script src="js/dateutils.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/indicators.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>
</body>
</html>
